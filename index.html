<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ITR · Taxpayer</title>
  <meta name="description" content="ITR for taxpayers: one place to collect documents, track status, and stay in sync with your CA.">
  <meta name="theme-color" content="#1c2d3f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/animations.css">
  <script type="module" src="js/app.js"></script>

<body>
  <div class="splash" id="splash" role="img" aria-label="ITR, file your taxes, stress-free. Loading.">
    <div class="splash__glow" aria-hidden="true"></div>
    <div class="splash__center" aria-hidden="true">
      <div class="splash__mark-wrap">
        <span class="splash__ring"></span>
        <svg class="splash__mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <defs>
            <linearGradient id="splash-grad" x1="0" y1="0" x2="0.6" y2="1">
              <stop offset="0" stop-color="#1c2d3f"/>
              <stop offset="1" stop-color="#3f7a8e"/>
            </linearGradient>
          </defs>
          <rect class="splash__tile" width="48" height="48" rx="13" fill="url(#splash-grad)"/>
          <path class="splash__doc" d="M17 10h10.5L34 16.5V35a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3Z" fill="#ffffff"/>
          <path class="splash__fold" d="M27.5 10v4.5a2 2 0 0 0 2 2H34Z" fill="#caf0f5"/>
          <path class="splash__check" d="M19 25.5l3.8 3.8 6.7-7.3" fill="none" stroke="#047e9d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="splash__word">ITR</p>
      <p class="splash__tag">File your taxes, stress-free</p>
    </div>
    <div class="splash__bar" aria-hidden="true"></div>
  </div>

  <a class="skip-link" href="#viewport">Skip to content</a>

  <div class="app" id="app" data-shell="auth" data-ready="false">
    <aside class="sidebar card--glass" id="sidebar" aria-label="Sidebar"></aside>
    <main class="viewport" id="viewport" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <div class="sr-only" id="live-region" aria-live="polite"></div>

  <noscript>
    <p>ITR needs JavaScript to run this prototype.</p>
  </noscript>
</body>
</html>
